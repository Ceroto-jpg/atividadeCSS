<html>
<head>
  <style>
    #tabela-dados {
      border: 1px solid #333;
      border-collapse: collapse;
    }

    #tabela-dados th,
    #tabela-dados td {
      border: 1px solid #333;
      padding: 8px;
    }

    #tabela-dados tbody tr:nth-child(even) {
      background-color: #f2f2f2;
    }

    #tabela-dados thead {
      background-color: #d9eaf7;
    }
  </style>
</head>
<body>
  <table id="tabela-dados">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Idade</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Ana</td>
        <td>25</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
